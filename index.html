<!DOCTYPE html>
<html>
<head>
  <base href="/nookandtag_webapp/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="nook&tag web app">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nook&tag">
  <link rel="apple-touch-icon" href="icons/Icon-192nooktag.png" />
  <link rel="icon" type="image/png" href="faviconnooktag.png"/>
  <title>nook&tag</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script src="main.dart.js?v=1.0.2"></script>

  <script>
    window.updateAvailable = false;

    function registerUpdateListener() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('flutter_service_worker.js?v=3784461303').then(registration => {
          registration.onupdatefound = () => {
            const newWorker = registration.installing;
            newWorker.onstatechange = () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.updateAvailable = true;
              }
            };
          };
        });
      }
    }

    registerUpdateListener();

    function reloadApp() {
      window.location.reload();
    }
  </script>

</body>
</html>
